# Serves the static build. TLS, HTTP→HTTPS and domain redirects (www, .ch) belong to the
# reverse proxy in front of this container; see README.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;

    # No access logs (see privacy page); errors still go to stderr.
    access_log off;

    error_page 404 /404.html;

    # Hashed build assets never change.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        # Pages are built as /imprint.html but linked as /imprint.
        try_files $uri $uri.html =404;
    }

    # Serve the home page directly; /index.html itself redirects to the clean URL.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /index.html {
        return 301 /;
    }
}
